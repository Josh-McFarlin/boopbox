# Publish a GitHub release when a pull request that adds a new firmware binary
# (project/firmware/releases/boopbox-X.Y.Z.fwsc) is merged into main.
#
# The version comes from the binary's filename. The release is tagged vX.Y.Z on
# the merge commit, its notes are the "## X.Y.Z" section of CHANGELOG.md
# (project/tools/changelog_section.py; checked on the PR by changelog-check.yml), and it carries
# the binary, BoopBox Trainer's binary when present (project/firmware/releases/boopbox-trainer-X.Y.Z.fwsc), and an offline editor
# built from the current source as boopbox-editor-X.Y.Z.html, plus SHA256SUMS.txt; the notes also give
# the binary's SHA-256 and how to install (.github/release-install.md).
# A version with a suffix (1.3.0-beta) is published as a pre-release. A PR
# without a new binary publishes nothing, and neither does a binary whose
# version has a release already.
#
# It can also be run by hand (Actions > Release on merge > Run workflow) for a
# version whose binary is on main already, for example when the run after the
# merge failed: give the version (1.9.9) and, for the link in the notes, the
# number of the PR that added it. It releases from the commit it runs on.
name: Release on merge

on:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - 'project/firmware/releases/*.fwsc'
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to release (its project/firmware/releases/boopbox-X.Y.Z.fwsc must be on this branch)'
        required: true
        type: string
      pr:
        description: 'The number of the PR that added it (for the link in the notes; optional)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      # the commit released: the merge commit, or (run by hand) the commit the run is on
      RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
    steps:
      - name: Check out the merge commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22   # web/package.json: node >= 22.18 (on 20, npm ci fails and the site does not build)

      - name: Find the new firmware binary
        id: fw
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT: ${{ github.event_name }}
          IN_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            # Run by hand: the version given, its binary on this commit
            if ! printf '%s' "$IN_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
              echo "::error::'$IN_VERSION' is not a version such as 1.9.9 or 1.3.0-beta"
              exit 1
            fi
            added="project/firmware/releases/boopbox-$IN_VERSION.fwsc"
            if [ ! -f "$added" ]; then
              echo "::error::$added is not on this commit"
              exit 1
            fi
          else
          # Newly added binaries only: a path move is not a new firmware release.
          added=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
            --jq '.[] | select(.status == "added") | .filename' \
            | grep -E '^project/firmware/releases/boopbox-[0-9][^/]*\.fwsc$' || true)
          if [ -z "$added" ]; then
            echo "::notice::No new project/firmware/releases/boopbox-X.Y.Z.fwsc in this PR: no release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          fi
          if [ "$(echo "$added" | wc -l)" -gt 1 ]; then
            echo "::warning::This PR adds several binaries; releasing the highest version"
          fi
          file=$(echo "$added" | sort -V | tail -n 1)
          ver=$(basename "$file" .fwsc); ver=${ver#boopbox-}
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Binary: $file (version $ver)"

          # The firmware's own version string should match the filename
          src=$(sed -nE 's/^#define FELUCCA_VERSION "BOOPBOX ([^"]+)".*/\1/p' project/firmware/src/ui.c | tr 'A-Z' 'a-z')
          if [ "$src" != "$ver" ]; then
            echo "::warning file=project/firmware/src/ui.c::FELUCCA_VERSION is '$src' but the binary is $ver"
          fi

      - name: Skip if this version is released already
        id: exists
        if: steps.fw.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.fw.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Release $TAG exists already: nothing published"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect the assets and their checksums
        if: steps.exists.outputs.skip == 'false'
        env:
          FILE: ${{ steps.fw.outputs.file }}
          VER: ${{ steps.fw.outputs.version }}
        run: |
          dir="$RUNNER_TEMP/assets"
          site="$RUNNER_TEMP/boopbox-site"
          mkdir -p "$dir"
          trainer="project/firmware/releases/boopbox-trainer-$VER.fwsc"
          trainer_args=()
          if [ -f "$trainer" ]; then
            trainer_args=(--trainer "$trainer")
          fi
          python3 web/make_site.py "$FILE" "$VER" "$site" "${trainer_args[@]}"
          cp "$site/firmware/boopbox-$VER.fwsc" "$dir/"
          if [ -f "$site/firmware/boopbox-trainer-$VER.fwsc" ]; then
            cp "$site/firmware/boopbox-trainer-$VER.fwsc" "$dir/"
          fi
          cp "$site/editor/boopbox-editor.html" "$dir/boopbox-editor-$VER.html"
          (cd "$dir" && sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS.txt")
          mv "$RUNNER_TEMP/SHA256SUMS.txt" "$dir/"
          cat "$dir/SHA256SUMS.txt"

      - name: Write the release notes
        if: steps.exists.outputs.skip == 'false'
        env:
          FILE: ${{ steps.fw.outputs.file }}
          VER: ${{ steps.fw.outputs.version }}
          SHA: ${{ env.RELEASE_SHA }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          case "$PR_NUMBER" in *[!0-9]*) PR_NUMBER= ;; esac   # (run by hand: a number, or nothing)
          if [ -n "$PR_NUMBER" ] && [ -z "$PR_URL" ]; then
            PR_URL="https://github.com/$GITHUB_REPOSITORY/pull/$PR_NUMBER"
          fi
          name=$(basename "$FILE")
          hash=$(sha256sum "$FILE" | cut -d' ' -f1)
          {
            echo "## What's new in $VER"
            echo
            if python3 project/tools/changelog_section.py "$VER" --repo "$GITHUB_REPOSITORY" --ref "$SHA"; then
              :
            elif [ -z "$PR_TITLE" ]; then
              # Run by hand: no PR text to fall back on
              echo "::error file=CHANGELOG.md::no '## $VER' section in CHANGELOG.md" >&2
              exit 1
            else
              # The PR check should prevent this; release anyway, with the PR's text
              echo "::warning file=CHANGELOG.md::no '## $VER' section: the release notes are the PR's description" >&2
              echo "**$PR_TITLE**"
              echo
              [ -n "$PR_BODY" ] && printf '%s\n' "$PR_BODY"
            fi
            echo
            # How to install (.github/release-install.md; @VERSION@, @FILE@ and @BLOB@ filled in)
            sed -e "s|@VERSION@|$VER|g" -e "s|@FILE@|$name|g" \
                -e "s|@BLOB@|https://github.com/$GITHUB_REPOSITORY/blob/$SHA|g" .github/release-install.md
            echo
            echo "### Checksum"
            echo
            echo "SHA-256 of \`$name\`:"
            echo
            echo '```'
            echo "$hash"
            echo '```'
            echo
            echo "All files: \`SHA256SUMS.txt\` (check with \`sha256sum -c SHA256SUMS.txt\`)."
            echo
            if [ -n "$PR_NUMBER" ]; then
              echo "---"
              echo "From #$PR_NUMBER: $PR_URL"
            fi
          } > "$RUNNER_TEMP/notes.md"

      - name: Create the release
        if: steps.exists.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.fw.outputs.version }}
          TAG: ${{ steps.fw.outputs.tag }}
          SHA: ${{ env.RELEASE_SHA }}
        run: |
          assets=("$RUNNER_TEMP"/assets/*)
          flags=()
          case "$VER" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "BoopBox $VER" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "${flags[@]}" \
            "${assets[@]}"
