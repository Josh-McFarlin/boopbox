# Publish a GitHub release when a pull request that adds a new firmware binary
# (docs/firmware/boopbox-X.Y.Z.fwsc) is merged into main.
#
# The version comes from the binary's filename. The release is tagged vX.Y.Z on
# the merge commit, its notes are the PR's title and description, and it carries
# the binary, the offline editor (docs/webapp/editor/boopbox-editor.html) as
# boopbox-editor-X.Y.Z.html, and SHA256SUMS.txt for both; the notes also give
# the binary's SHA-256. A version with a suffix (1.3.0-beta) is published
# as a pre-release. A PR without a new binary publishes nothing, and neither does
# a binary whose version has a release already.
name: Release on merge

on:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - 'docs/firmware/*.fwsc'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Check out the merge commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Find the new firmware binary
        id: fw
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Binaries the PR added (not modified or removed)
          added=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
            --jq '.[] | select(.status == "added" or .status == "renamed") | .filename' \
            | grep -E '^docs/firmware/boopbox-[0-9][^/]*\.fwsc$' || true)
          if [ -z "$added" ]; then
            echo "::notice::No new docs/firmware/boopbox-X.Y.Z.fwsc in this PR: no release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(echo "$added" | wc -l)" -gt 1 ]; then
            echo "::warning::This PR adds several binaries; releasing the highest version"
          fi
          file=$(echo "$added" | sort -V | tail -n 1)
          ver=$(basename "$file" .fwsc); ver=${ver#boopbox-}
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Binary: $file (version $ver)"

          # The firmware's own version string should match the filename
          src=$(sed -nE 's/^#define FELUCCA_VERSION "BOOPBOX ([^"]+)".*/\1/p' firmware/src/ui.c | tr 'A-Z' 'a-z')
          if [ "$src" != "$ver" ]; then
            echo "::warning file=firmware/src/ui.c::FELUCCA_VERSION is '$src' but the binary is $ver"
          fi

      - name: Skip if this version is released already
        id: exists
        if: steps.fw.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.fw.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Release $TAG exists already: nothing published"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect the assets and their checksums
        if: steps.exists.outputs.skip == 'false'
        env:
          FILE: ${{ steps.fw.outputs.file }}
          VER: ${{ steps.fw.outputs.version }}
        run: |
          dir="$RUNNER_TEMP/assets"
          mkdir -p "$dir"
          cp "$FILE" "$dir/"
          editor="docs/webapp/editor/boopbox-editor.html"
          if [ -f "$editor" ]; then
            cp "$editor" "$dir/boopbox-editor-$VER.html"
          fi
          (cd "$dir" && sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS.txt")
          mv "$RUNNER_TEMP/SHA256SUMS.txt" "$dir/"
          cat "$dir/SHA256SUMS.txt"

      - name: Write the release notes
        if: steps.exists.outputs.skip == 'false'
        env:
          FILE: ${{ steps.fw.outputs.file }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          name=$(basename "$FILE")
          hash=$(sha256sum "$FILE" | cut -d' ' -f1)
          {
            echo "## $PR_TITLE"
            echo
            if [ -n "$PR_BODY" ]; then
              printf '%s\n' "$PR_BODY"
              echo
            fi
            echo "### Checksum"
            echo
            echo "SHA-256 of \`$name\`:"
            echo
            echo '```'
            echo "$hash"
            echo '```'
            echo
            echo "All files: \`SHA256SUMS.txt\` (check with \`sha256sum -c SHA256SUMS.txt\`)."
            echo
            echo "---"
            echo "From #$PR_NUMBER by @$PR_AUTHOR: $PR_URL"
          } > "$RUNNER_TEMP/notes.md"

      - name: Create the release
        if: steps.exists.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.fw.outputs.version }}
          TAG: ${{ steps.fw.outputs.tag }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          assets=("$RUNNER_TEMP"/assets/*)
          flags=()
          case "$VER" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "BoopBox $VER" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "${flags[@]}" \
            "${assets[@]}"
