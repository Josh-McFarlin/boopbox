Kit:`キット`,lvFx:`パンチイン・エフェクト`,lvFxHint:`パッドを押している間（または Shift + キー）エフェクトがかかります。LATCH：タップでオン、もう一度でオフ。`,lvLatch:`ラッチ`,lvFxLoops:`ループ・時間`,lvFxTone:`フィルター・EQ`,lvFxColour:`音色`,lvFxMove:`動き`,lvKeys:`鍵盤`,lvTrack:`トラック`,lvOct:`オクターブ`,lvVel:`ベロシティ`,lvArp:`アルペジオ`,lvHold:`ホールド`,lvLvl:[`GHOST`,`SOFT`,`NORM`,`HARD`],lvNoChan:`このトラックはノートを受けません：MIDI にチャンネルがなく OTHER が OFF です。`,lvClock:`MIDI 3 > IN = CLOCK：FM-1 はノートを無視します。ここから演奏するには IN を NOTES に。`,lvShortcuts:`Space 再生/停止 · 1–4 セクション · 5–8 ミュート（演奏中のトラックの4トラック）· Shift+5–8 ソロ · 9 フィル（押す間）· 0 次の小節フィル · B タップ · C 録音 · N 次のソング · Z / X オクターブ · ← → トラック · A W S E D F T G Y H U J K O L P 演奏 · Shift + それらのキー：エフェクト · F1–F8 シーン（Shift：保存）· Esc 全オフ`,lvPanic:`全オフ`,lvStored:`ループを保存：セクション `,lvxHelpShow:`使い方`,lvxViewAll:`表示：すべて`,lvxViewSimple:`表示：基本`,lvxGuideTitle:`はじめてのライブ 5 ステップ`,lvxGuideOk:`わかった`,lvxGuideSteps:[`再生（Space）を押す。FM-1 がループを再生し、小節.拍が進みます。`,`セクション A–D で曲を作る：好きなループで「ループを保存」の A を押し、ループを変えて B に保存…。A–D をタップすると次の小節で切り替わります。`,`フェーダー、ミュート、ソロでミックス。エフェクトパッド（LOOP 4、STOP、KILL LOW…）を押している間だけパンチインします。`,`シーンは「何が鳴るか」ではなく「どう鳴るか」を変えます：静かなミックスをシーン 1（フィルタ閉、リバーブ少）、大きいミックスをシーン 2 に保存し、1 と 2 をタップ。4 小節のモーフでゆっくり移ることも。`,`1 本のショーには：各ソングを書き出し（保存と読込 → このソングを書き出す）プレイリストに追加、MIDI コントローラーを覚えさせ（MIDI ラーン）、本番前にロック、セットを録音。`],lvxGuideFoot:`各カードの「?」が説明します。コントロールにマウスを置くと何をするか表示されます。「表示：基本」は上級カードを隠します。`,lvxSub_transport:`スタート、ストップ、録音、テンポ。`,lvxSub_sections:`何が鳴るか：ソングの 4 つのパート（ノート）。`,lvxSub_scenes:`どう鳴るか：ミックスとエフェクトのスナップショットをワンタップで。`,lvxSub_mixer:`トラックごと：音色、レベル、フィルタ、センド、ミュート、ソロ。`,lvxSub_keys:`「演奏」で選んだトラックを鍵盤で（ドラムは 16 パッド）。`,lvxSub_perform:`演奏中のトラックのすべてのノブを 4 つのタブで。`,lvxSub_fx:`パッドを押している間だけ鳴るエフェクト（FM-1 の FX + キー）。`,lvxSub_master:`ミックス全体に：DJ フィルタ、ローファイのダスト、キックのダッキング。`,lvxSub_playlist:`ソングを順番に、1 本のセットとして。`,lvxHelp_transport:`再生／停止：PLAY ボタンと同じ。録音：演奏中のトラックに録音（FM-1 の REC と同じ）。空のプロジェクトでは、もう一度押すとループが確定。元に戻す／やり直す：最後の録音や編集。
BPM：ノブを上下にドラッグ（Shift で細かく）、またはタップ。SWING：まっすぐからシャッフルまで。カウンターは小節.拍、ソングモードではソングの位置。
ループ／ソング：ループ再生かソング（セクションの順）。ソング録音：演奏したセクションの順がソングになります。フィル（押す間）、次の小節フィル。
全オフ：すべてのノートとエフェクトを止めます。全画面：ページのみ。
2 段目：時計とセットの時間（タップでリセット）、セット録音（FM-1 の USB オーディオを WAV に）、MIDI ラーンとロック。`,lvxHelp_sections:`セクションはループ全体：4 トラックのパターン、音色、ミックス。ソングは A、B、C、D（例：A イントロ、B バース、C サビ、D ブレイク）。
作り方：ループを鳴らし、「ループを保存」の文字を押します。使用中のセクションは確認してから上書き。
切り替え：A–D をタップ（1–4 キー）。再生中は次の小節から（待つ間点滅）、停止中はすぐ。
セクションは「何が鳴るか」（ノート）を変えます。ノートを変えずに「どう鳴るか」を変えるにはシーンを使います。
チェーン：2 つ以上の文字（A B B C…）をタップしてチェーン再生。各セクションをその小節数鳴らして次へ、繰り返し（FM-1 の SAVE + 複数キーと同じ）。チェーン停止で 1 つのセクションに戻ります。`,lvxHelp_scenes:`シーンはノブの写真です：各トラックのレベル、ミュート、パン、フィルタ、センド、ドライブ、音色のノブ、エンベロープ、LFO、INSERT、アルペジオ、そしてマスターエフェクト。ノートには触れません。
例：シーン 1「イントロ」＝フィルタ閉、ドラム小さめ、リバーブ少；シーン 2「ドロップ」＝全開。ループを鳴らして 1、ドロップで 2 をタップ。
保存：ノブを決めて「保存」、シーンパッドを押す。ダブルクリックで名前。F1–F8 呼び出し、Shift+F1–F8 保存。
モーフ：「すぐ」は即切替、1–16 小節はゆっくり移ります（ビルドアップ）。＋音色：プリセットとキットも読み込み。＋テンポ：BPM も。
クロスフェーダー：2 つのシーン（A と B）を選び、手でスライド。`,lvxHelp_mixer:`トラックごとに 1 本（1–3 シンセ、D ドラム）。リストと ‹ › で音色（ドラムはキット）、☆ でお気に入り。
フェーダーはレベル（横にメーター）、音色の下の細い線はパターンの位置。
filt：左ローパス（暗く）、右ハイパス（細く）。pan：左右。rev、dly、cho：リバーブ、ディレイ、コーラスへの量。drive：サチュレーション。
ミュート／ソロ：GLO + キーと同じ。演奏：下の鍵盤とパフォームがこのトラックに（FM-1 でも選択されるので REC で録音）。`,lvxHelp_keys:`鍵盤は「演奏」で選んだトラックを MIDI ノートで鳴らします：すぐ鳴り、REC で録音されます。
パソコン：A W S E D F T G Y H U J K O L P が鍵盤、Z / X でオクターブ。ドラムは同じ文字が 16 パッド、強さは 4 段階（GHOST、SOFT、NORM、HARD）。
ベロシティ：強さ。アルペジオ：トラックのアルペジオモード。ホールド：離しても鳴り続けます。
演奏／ロール／消去：鍵盤とパッドの動作。ロールは押している間ロールの速さで連打（ARP + キーと同じ）、REC 中は録音されます。消去は押している間そのノートやドラム音をパターンから消します：再生中は通ったステップ、停止中は全ステップ（EDIT + キーと同じ、アンドゥで戻せます）。`,lvxHelp_perform:`演奏中のトラックのすべてを、メニューなしで。
音色：エンジンの値（FM-1 の EDIT ページ）、3 つのマクロ（FLT PIT SHP）、エンベロープとグライド、LFO。
アルペジオ・キー：アルペジオ（モード、速さ、オクターブ、ゲート、スウィング、順序、ホールド）、キー（ルート、スケール、コード、トランスポーズ）——「全シンセトラック」で 3 つのシンセに送ります。
インサート・バス：トラックの INSERT とフィルタ、共有のディレイ、リバーブ、コーラス、TEXTURE、メトロノーム。
ステップ：パターンのグリッド。タップでオン／オフ（新しいシンセステップは最後に弾いた音）、右クリックでフィル条件（黄：フィルのみ、赤：フィルなし）。LEN、DIV、SWG、GATE：長さ、速さ、スウィング、音の長さ。
ドラムの音色タブ：パッドを選び、チューン（半音）とディケイ（DRUMS の SOUND ページと同じ）。ステップタブのパターンボタン：全体を 1 ステップずらす、長さ ½ / ×2、トランスポーズ（各 1 回のアンドゥ）。`,lvxHelp_fx:`パンチインエフェクトはパッドを押している間（または Shift + 文字キー）だけ鳴り、離すと元通り。何も録音・変更されません。
ループ・タイム：直前の拍の繰り返し（LOOP 4…32）、スタッター、リバース、ストップ、半速、巻き戻し、フリーズ。フィルタ・EQ：ロー／ハイパス、帯域カット、電話。カラー：クラッシュ、エイリアス、オクターブ上、フランジャー、エコー。ムーブメント：ゲート、ワブル、オートパン、モノ、フェードアウト。
ラッチ：タップでオンのまま、もう一度（または別のエフェクト）でオフ。`,lvxHelp_master:`トラックの後、ミックス全体にかかります。
フィルタ：DJ フィルタ（左暗く、右細く、中央オフ）。ダスト：ローファイ（ノイズ、揺れ、ざらつき）。ダック：キックが他のトラックを押し下げます（ポンピング）。
音量：ここから FM-1 の音量。MASTER ノブを回すとノブに戻ります（ノブ：すぐ戻す）。リバーブスロー／エコースロー：押す間、全トラックがリバーブかディレイへ（FX + OCT- / OCT+ と同じ）、離すと戻ります。`,lvxHelp_playlist:`複数のソングのセット用。まず各ソングをファイルに：保存と読込 → このソングを書き出す（ループ、A–D と順番）。
ソングを追加：ファイルをここへ。ソングをタップ（または次のソング、N キー）：FM-1 が止まり、数秒で読み込み、「読み込んだら再生」で始まります。
✎ でソングのテンポ（読み込み時に設定）とキュー（ステージ用メモ、再生中に表示、次のソングも）。

ec:`rec`,lvRecArm:`rec armed`,lvRecFree:`rec: close loop`,lvUndo:`undo`,lvRedo:`redo`,lvBpm:`BPM`,lvTap:`tap`,lvSwing:`swing`,lvBar:`bar`,lvSong:`song`,lvLoop:`loop`,lvSongRec:`song rec`,lvFill:`fill`,lvFillHold:`hold`,lvFillBar:`fill bar`,lvCpu:`CPU`,lvFull:`full screen`,lvFullOff:`exit full screen`,lvSections:`sections`,lvSecHint:`Tap: plays on the next bar (stopped: at once).`,lvSecPlaying:`playing`,lvSecNext:`next`,lvSecEmpty:`empty`,lvStore:`save the loop into`,lvStoreAsk:`Replace section {x} with the loop playing now?`,lvMixer:`mixer`,lvMute:`mute`,lvSolo:`solo`,lvSel:`play`,lvSelOn:`playing`,lvLevel:`level`,lvPan:`pan`,lvFilter:`filter`,lvRev:`reverb`,lvDly:`delay`,lvCho:`chorus`,lvDrive:`drive`,lvMaster:`master fx`,lvDust:`dust`,lvDuck:`duck`,lvSound:`sound`,lvKit:`kit`,lvFx:`punch-in effects`,lvFxHint:`Hold a pad (or Shift + a key): the effect plays while held. LATCH: a tap turns it on, another tap off.`,lvLatch:`latch`,lvFxLoops:`loops & time`,lvFxTone:`filter & EQ`,lvFxColour:`colour`,lvFxMove:`movement`,lvKeys:`keys`,lvTrack:`track`,lvOct:`octave`,lvVel:`velocity`,lvArp:`arp`,lvHold:`hold`,lvLvl:[`GHOST`,`SOFT`,`NORM`,`HARD`],lvNoChan:`The FM-1 does not take notes for this track: MIDI gives it no channel and OTHER is OFF.`,lvClock:`MIDI 3 > IN = CLOCK: the FM-1 ignores notes. Set IN to NOTES to play from here.`,lvShortcuts:`Space play / stop · 1–4 sections · 5–8 mute (the bank of four of the track played) · Shift+5–8 solo · 9 fill (hold) · 0 fill bar · B tap · C rec · N next song · Z / X octave · ← → track · keys A W S E D F T G Y H U J K O L P play · Shift + those keys: effects · F1–F8 scenes (Shift: store) · Esc all off`,lvPanic:`all off`,lvStored:`Loop saved into section `,lvxHelpShow:`how it works`,lvxViewAll:`view: everything`,lvxViewSimple:`view: essentials`,lvxGuideTitle:`first live in 5 steps`,lvxGuideOk:`got it`,lvxGuideSteps:[`Press PLAY (or Space). The FM-1 plays its loop; the bar.beat counter moves.`,`Build your song with the sections A–D: play a loop you like, press A under “save the loop into”, change the loop, save it into B… Tap A, B, C or D: the FM-1 jumps there at the next bar.`,`Mix with the faders, mute and solo. Hold an effect pad (LOOP 4, STOP, KILL LOW…) for a punch-in that lasts while you hold it.`,`Scenes change how it sounds, not what plays: store a calm mix in scene 1 (filters closed, little reverb) and a big one in scene 2, then tap 1 and 2 — or choose a morph of 4 bars to glide from one to the other.`,`For a whole show: export each song (Save & load → Export this song) and add them to the playlist, teach your MIDI controller the page (MIDI learn), lock the page before you go on, and record the set.`],lvxGuideFoot:`Every card has a “?” that explains it, and a mouse over a control says what it does. “view: essentials” hides the advanced cards.`,lvxSub_transport:`Start, stop, record and keep time.`,lvxSub_sections:`What plays: the four parts of your song (the notes).`,lvxSub_scenes:`How it sounds: snapshots of the mix and effects, recalled with one tap.`,lvxSub_mixer:`Each track: its sound, level, filter, sends, mute and solo.`,lvxSub_keys:`Play the track chosen with “play”: the keys, or the 16 pads for the drums.`,lvxSub_perform:`Every knob of the track you play, in four tabs.`,lvxSub_fx:`Effects that play while you hold the pad, like FX + a key on the FM-1.`,lvxSub_master:`On the whole mix: the DJ filter, the lo-fi dust, the kick's ducking.`,lvxSub_playlist:`Your songs, one after the other, for a whole set.`,lvxHelp_transport:`PLAY / STOP: as the PLAY button. REC: records into the track you play (as REC on the FM-1); in an empty project, REC again closes the loop. undo / redo: the last recording or edit.
BPM: drag the knob up or down (Shift: fine), or tap TAP in time. SWING: from straight to shuffled. The counter shows bar.beat, and in song mode the part and bar of the song.
loop / song: the loop playing, or the song (the sections in order). song rec: the order you play the sections becomes the song. FILL while held, FILL BAR: the next bar is a fill (the steps marked “fill only” play).
all off: lets go of every note and effect. full screen: the page alone.
The second row: the clock and the set's time (tap it to start again), record set (a WAV of what the FM-1 plays, from its USB audio), MIDI learn and lock (see their tips).`,lvxHelp_sections:`A section is a whole loop: every track's patterns, sounds and mix. A song is A, B, C, D — for example A intro, B verse, C chorus, D break.
To make one: play the loop you want, then under “save the loop into” press a letter. A used section asks before it is replaced.
To switch: tap A–D (or keys 1–4). Playing, the new section starts at the next bar (it blinks while it waits); stopped, at once.
Sections change WHAT plays (the notes). To change HOW it sounds without changing the notes, use the scenes.
chain: tap two or more letters (A B B C…), then play chain: each section plays for its own bars, then the next, and the chain loops — as SAVE + several keys on the FM-1. stop chain goes back to one section.`,lvxHelp_scenes:`A scene is a photo of your knobs: each track's level, mute, pan, filter, sends, drive, sound knobs, envelope, LFO, INSERT and arp, and the master effects. It does not touch the notes.
Example: scene 1 “intro” = filters closed, drums low, little reverb; scene 2 “drop” = everything open and loud. Play your loop, tap 1, then 2 at the drop: the FM-1 jumps from one sound to the other.
To store: set the knobs as you want them, press STORE, then a scene pad. Double-click a pad to name it. F1–F8 recall, Shift+F1–F8 store.
morph: “at once” jumps; 1–16 bars glides there slowly (a build-up). + sounds: the scene also loads its presets and kit. + tempo: it also sets the BPM.
The crossfader: pick two scenes (A and B) and slide between them by hand, like a DJ.`,lvxHelp_mixer:`One strip per track (1–3 synths, D drums). The list and ‹ › change the sound (the drums: the kit); ☆ makes it a favourite.
The fader is the level (its meter beside it); the thin bar under the sound is where the pattern is.
filt: left a low-pass (darker), right a high-pass (thinner). pan: left / right. rev, dly, cho: how much goes to the reverb, delay, chorus. drive: saturation.
mute / solo: as GLO + key. play: the keys below and the PERFORM card follow this track (it is selected on the FM-1 too, so REC records it).`,lvxHelp_keys:`The keys play the track chosen with “play” (or the track buttons here), as real MIDI notes: they sound at once, and REC records them.
On the computer: A W S E D F T G Y H U J K O L P are the keys (white and black), Z / X change the octave. For the drums, the same letters are the 16 pads, with four strengths (GHOST, SOFT, NORM, HARD).
velocity: how hard the keys play. arp: the track's arpeggiator mode, hold: notes keep playing after you let go.
play / roll / erase: what the keys and pads do. roll repeats the note or drum sound while you hold it, at the roll rate (as ARP + key); playing with REC on, it is recorded. erase removes that note or drum sound from the pattern while you hold it: playing, the steps it passes; stopped, every step (as EDIT + key; undo brings it back).`,lvxHelp_perform:`Everything you can turn on the track you play, without menus.
sound: the engine's own values (as the FM-1's EDIT page), the three macros (FLT PIT SHP), the envelope and glide, the LFO.
arp & key: the arpeggiator (mode, rate, octaves, gate, swing, order, hold); the key (root, scale, chord, transpose) — “every synth track” sends the key to all three synths.
insert & bus: the track's INSERT effect and filter; the shared delay, reverb, chorus, TEXTURE (a background bed) and the metronome.
steps: the pattern as a grid. Tap a step to turn it on or off (a new synth step plays the last note you played); right-click for its fill condition (yellow: only in a fill, red: never in a fill). LEN, DIV, SWG, GATE: the pattern's length, speed, swing and note length.
The drums' sound tab: pick a pad, then its tune (semitones) and decay, as the DRUMS screen's SOUND page. The steps tab's pattern buttons: shift the whole pattern a step, half or double its length, transpose it — each one undo.`,lvxHelp_fx:`Punch-in effects play only while you hold the pad (or Shift + a letter key), then the sound comes back exactly as it was: nothing is recorded or changed.
loops & time: repeat the last beats (LOOP 4 … 32), stutter, reverse, stop, half speed, rewind, freeze. filter & EQ: low / high pass, kill a band, phone. colour: crush, alias, octave up, flanger, echo. movement: gate, wobble, auto-pan, mono, fade out.
latch: a tap turns the effect on and it stays; another tap (or another effect) turns it off.`,lvxHelp_master:`These act on the whole mix, after the tracks.
